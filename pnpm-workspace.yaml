# pnpm v10+ leser settings som `overrides` herfra (ikke lenger fra
# package.json sin "pnpm"-blokk). Vi har ikke et reelt workspace, men
# denne fila er det nye hjemmet for transitive dependency-overrides.
#
# Tvinger form-data >= 4.0.4 for å lukke GHSA-fjxv-7rqg-78g4 (critical):
# form-data < 4.0.4 bruker en usikker random-funksjon for å velge
# multipart-boundary. Pakken dras inn transitivt via n8n-workflow.
overrides:
  form-data@>=4.0.0 <4.0.4: ^4.0.4
